# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=ShopSmart AI

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.smartcart.ai=INFO
logging.level.root=WARN

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ─── External Product Provider Configuration ──────────────────────────────────
# Disabled by default; application functions seamlessly using LocalCatalogProvider
product.provider.external.enabled=${PRODUCT_PROVIDER_ENABLED:false}
product.provider.external.base-url=${PRODUCT_PROVIDER_BASE_URL:}
product.provider.external.api-key=${PRODUCT_PROVIDER_API_KEY:}
product.provider.external.timeout-ms=${PRODUCT_PROVIDER_TIMEOUT:5000}
product.provider.external.page-size=${PRODUCT_PROVIDER_PAGE_SIZE:20}

# ─── Flipkart Affiliate API Configuration ─────────────────────────────────────
# Disabled by default; application functions seamlessly using LocalCatalogProvider
# Enable after obtaining Flipkart Affiliate credentials
flipkart.provider.enabled=${FLIPKART_PROVIDER_ENABLED:false}
flipkart.affiliate.id=${FLIPKART_AFFILIATE_ID:}
flipkart.affiliate.token=${FLIPKART_AFFILIATE_TOKEN:}
flipkart.api.base-url=${FLIPKART_API_BASE_URL:https://affiliate-api.flipkart.net/affiliate/api}
flipkart.api.timeout-ms=${FLIPKART_API_TIMEOUT:5000}



# ─── Amazon Product Advertising API Configuration ────────────────────────────
# Placeholder — no implementation yet. All defaults to disabled/blank.
# Enable after obtaining Amazon Associates PA API v5 credentials.
amazon.provider.enabled=${AMAZON_PROVIDER_ENABLED:false}
amazon.access.key=${AMAZON_ACCESS_KEY:}
amazon.secret.key=${AMAZON_SECRET_KEY:}
amazon.partner.tag=${AMAZON_PARTNER_TAG:}
amazon.marketplace=${AMAZON_MARKETPLACE:www.amazon.in}
amazon.api.timeout-ms=${AMAZON_API_TIMEOUT:5000}

# ─── Product Cache Configuration ─────────────────────────────────────────────
product.cache.ttl-seconds=${PRODUCT_CACHE_TTL_SECONDS:300}
product.cache.max-entries=${PRODUCT_CACHE_MAX_ENTRIES:200}

# ─── Provider Rate-Limit Configuration ───────────────────────────────────────
product.ratelimit.max-requests-per-window=${RATELIMIT_MAX_REQUESTS:100}
product.ratelimit.window-seconds=${RATELIMIT_WINDOW_SECONDS:60}
product.ratelimit.cooldown-seconds=${RATELIMIT_COOLDOWN_SECONDS:30}
